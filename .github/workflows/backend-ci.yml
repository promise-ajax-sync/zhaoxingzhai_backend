name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zhaoxingzhai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zhaoxingzhai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/zhaoxingzhai_test
      APP_DEVICE_HASH_SECRET: ci-device-secret
      APP_ACCESS_TOKEN_SECRET: ci-access-token-secret
      AI_API_KEY: ''
      AI_MODEL: ''

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"

      - name: Compile Python sources
        run: python -m compileall -q app tests migrations scripts

      - name: Run database migrations
        run: alembic upgrade head

      - name: Run tests
        run: pytest -q
